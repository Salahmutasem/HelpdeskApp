services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: helpdesk-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Salah@123!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
      - ./Docker:/docker

volumes:
  sqldata:
